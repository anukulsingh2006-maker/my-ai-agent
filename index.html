<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My AI Assistant</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #f6f9fc;
            --bg-secondary: #ffffff;
            --bg-input: #f1f4f9;
            --bg-message-user: #007aff;
            --bg-message-ai: #e9edf4;
            --text-primary: #1d1d2c;
            --text-secondary: #4a4a5a;
            --text-message-user: #ffffff;
            --text-message-ai: #1d1d2c;
            --border-color: #dce1e8;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --radius: 18px;
            --radius-sm: 12px;
            --transition: 0.3s ease;
            --header-bg: rgba(255, 255, 255, 0.72);
            --footer-bg: rgba(255, 255, 255, 0.72);
            --placeholder-color: #8e8ea0;
            --scrollbar-track: transparent;
            --scrollbar-thumb: #c5cbd5;
            --logo-color: #007aff;
        }
        [data-theme="dark"] {
            --bg-primary: #0d0d1a;
            --bg-secondary: #1a1a2e;
            --bg-input: #2a2a42;
            --bg-message-user: #007aff;
            --bg-message-ai: #2a2a42;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-message-user: #ffffff;
            --text-message-ai: #e8e8f0;
            --border-color: #333355;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --header-bg: rgba(13, 13, 26, 0.8);
            --footer-bg: rgba(13, 13, 26, 0.8);
            --placeholder-color: #6a6a88;
            --scrollbar-thumb: #3a3a5a;
            --logo-color: #4a9aff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: background var(--transition), color var(--transition); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
        .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; padding: 0 16px; position: relative; }
        .app-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 12px; background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; flex-shrink: 0; transition: background var(--transition), border-color var(--transition); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: var(--logo-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 700; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25); }
        .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
        .logo-text span { color: var(--logo-color); }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background var(--transition), color var(--transition), transform 0.15s; background: var(--bg-input); color: var(--text-primary); }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.96); }
        .btn-new { background: var(--logo-color); color: #fff; padding: 8px 18px; box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25); }
        .btn-new:hover { background: #0066dd; }
        .btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 16px; background: var(--bg-input); color: var(--text-secondary); }
        .btn-icon:hover { background: var(--border-color); }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px 4px 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .chat-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: var(--text-secondary); padding: 20px; }
        .chat-empty .big-icon { font-size: 64px; color: var(--logo-color); opacity: 0.4; margin-bottom: 20px; }
        .chat-empty h2 { font-size: 24px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        .message { display: flex; flex-direction: column; max-width: 80%; padding: 12px 18px; border-radius: var(--radius); font-size: 15px; line-height: 1.6; word-wrap: break-word; animation: fadeIn 0.3s ease; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04); }
        .message-user { align-self: flex-end; background: var(--bg-message-user); color: var(--text-message-user); border-bottom-right-radius: 6px; }
        .message-ai { align-self: flex-start; background: var(--bg-message-ai); color: var(--text-message-ai); border-bottom-left-radius: 6px; }
        .message-ai .msg-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; opacity: 0.7; letter-spacing: 0.3px; }
        .message-ai .msg-content, .message-user .msg-content { white-space: pre-wrap; }
        .message .copy-btn { margin-top: 8px; align-self: flex-end; background: transparent; border: none; color: var(--text-secondary); font-size: 13px; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; padding: 4px 8px; border-radius: 6px; }
        .message .copy-btn:hover { opacity: 1; background: var(--bg-input); }
        .typing-indicator { align-self: flex-start; background: var(--bg-message-ai); color: var(--text-message-ai); padding: 14px 22px; border-radius: var(--radius); border-bottom-left-radius: 6px; display: none; align-items: center; gap: 6px; font-size: 14px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04); }
        .typing-indicator .dots { display: flex; gap: 4px; }
        .typing-indicator .dot { width: 8px; height: 8px; background: var(--text-secondary); border-radius: 50%; animation: dotBounce 1.2s infinite; }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.3; } 30% { transform: translateY(-6px); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .input-area { display: flex; align-items: flex-end; gap: 12px; padding: 16px 0 20px; background: var(--footer-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); flex-shrink: 0; transition: background var(--transition), border-color var(--transition); }
        .input-wrapper { flex: 1; display: flex; align-items: flex-end; gap: 12px; background: var(--bg-input); border-radius: var(--radius); padding: 6px 6px 6px 18px; border: 1px solid transparent; transition: border-color 0.2s, background var(--transition); }
        .input-wrapper:focus-within { border-color: var(--logo-color); background: var(--bg-secondary); }
        .input-wrapper textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-family: 'Inter', sans-serif; font-size: 15px; color: var(--text-primary); padding: 10px 0; min-height: 24px; max-height: 140px; line-height: 1.5; }
        .input-wrapper textarea::placeholder { color: var(--placeholder-color); }
        .input-wrapper .btn-send { background: var(--logo-color); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: background 0.2s, transform 0.15s; display: flex; align-items: center; justify-content: center; }
        .input-wrapper .btn-send:hover { background: #0066dd; transform: scale(1.04); }
        .input-wrapper .btn-send:active { transform: scale(0.92); }
        .input-wrapper .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        @media (max-width: 640px) { .app-container { padding: 0 12px; } .logo-text { font-size: 17px; } .logo-icon { width: 34px; height: 34px; font-size: 16px; } .btn-new span { display: none; } .btn-new { padding: 8px 14px; } .message { max-width: 92%; font-size: 14px; padding: 10px 14px; } .input-wrapper { padding: 4px 4px 4px 14px; } .input-wrapper textarea { font-size: 14px; padding: 8px 0; } .input-wrapper .btn-send { width: 40px; height: 40px; font-size: 16px; } .chat-empty .big-icon { font-size: 48px; } .chat-empty h2 { font-size: 20px; } }
        @media (max-width: 400px) { .header-actions .btn-icon { width: 34px; height: 34px; font-size: 14px; } .btn-new { padding: 6px 12px; font-size: 13px; } }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">AI</div>
                <div class="logo-text">My <span>AI</span> Assistant</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-new" id="newChatBtn"><i class="fas fa-plus"></i> <span>New Chat</span></button>
                <button class="btn btn-icon" id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
            </div>
        </header>
        <div class="chat-area" id="chatArea">
            <div class="chat-empty" id="emptyState">
                <div class="big-icon">🤖</div>
                <h2>How can I help you?</h2>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span>Thinking</span>
                <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" rows="1" placeholder="Type your message…" aria-label="Message input"></textarea>
                <button class="btn-send" id="sendBtn" aria-label="Send message"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>
    <script>
        (function() {
            'use strict';
            const chatArea = document.getElementById('chatArea');
            const emptyState = document.getElementById('emptyState');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const themeToggle = document.getElementById('themeToggle');
            const typingIndicator = document.getElementById('typingIndicator');
            let conversationHistory = [];
            let isProcessing = false;
            let currentTheme = 'light';

            const savedTheme = localStorage.getItem('ai-assistant-theme');
            if (savedTheme) {
                currentTheme = savedTheme;
                document.documentElement.setAttribute('data-theme', currentTheme);
                updateThemeIcon();
            }

            function updateThemeIcon() {
                const icon = themeToggle.querySelector('i');
                if (currentTheme === 'dark') { icon.className = 'fas fa-sun'; } 
                else { icon.className = 'fas fa-moon'; }
            }

            function toggleTheme() {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', currentTheme);
                localStorage.setItem('ai-assistant-theme', currentTheme);
                updateThemeIcon();
            }

            function autoResize() {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
            }

            function scrollToBottom() {
                chatArea.scrollTop = chatArea.scrollHeight;
            }

            function updateEmptyState() {
                const messages = chatArea.querySelectorAll('.message');
                if (messages.length === 0) { emptyState.style.display = 'flex'; } 
                else { emptyState.style.display = 'none'; }
            }

            function addMessage(role, content) {
                emptyState.style.display = 'none';
                const div = document.createElement('div');
                div.className = 'message message-' + role;
                if (role === 'ai') {
                    const label = document.createElement('div');
                    label.className = 'msg-label';
                    label.textContent = 'AI Assistant';
                    div.appendChild(label);
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'msg-content';
                    contentDiv.textContent = content;
                    div.appendChild(contentDiv);
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                    copyBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        navigator.clipboard.writeText(content).then(() => {
                            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                            setTimeout(() => { copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy'; }, 2000);
                        }).catch(() => {});
                    });
                    div.appendChild(copyBtn);
                } else {
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'msg-content';
                    contentDiv.textContent = content;
                    div.appendChild(contentDiv);
                }
                chatArea.insertBefore(div, typingIndicator);
                scrollToBottom();
            }

            function showTyping() { typingIndicator.style.display = 'flex'; scrollToBottom(); }
            function hideTyping() { typingIndicator.style.display = 'none'; }

            async function sendMessage(userMessage) {
                if (isProcessing) return;
                const trimmed = userMessage.trim();
                if (!trimmed) return;
                addMessage('user', trimmed);
                conversationHistory.push({ role: 'user', content: trimmed });
                messageInput.value = '';
                autoResize();
                messageInput.focus();
                isProcessing = true;
                sendBtn.disabled = true;
                showTyping();
                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: conversationHistory })
                    });
                    const data = await response.json();
                    if (!response.ok) { throw new Error(data.error || 'Something went wrong'); }
                    const aiContent = data.reply;
                    addMessage('ai', aiContent);
                    conversationHistory.push({ role: 'assistant', content: aiContent });
                } catch (error) {
                    console.error('Chat error:', error);
                    addMessage('ai', '⚠️ Sorry, I encountered an error. Please try again later.');
                } finally {
                    isProcessing = false;
                    sendBtn.disabled = false;
                    hideTyping();
                    updateEmptyState();
                }
            }

            function clearChat() {
                const messages = chatArea.querySelectorAll('.message');
                messages.forEach(el => el.remove());
                conversationHistory = [];
                updateEmptyState();
                hideTyping();
                messageInput.focus();
            }

            function init() {
                sendBtn.addEventListener('click', function() {
                    const text = messageInput.value;
                    if (text.trim()) { sendMessage(text); }
                });
                messageInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        const text = messageInput.value;
                        if (text.trim()) { sendMessage(text); }
                    }
                });
                messageInput.addEventListener('input', autoResize);
                newChatBtn.addEventListener('click', clearChat);
                themeToggle.addEventListener('click', toggleTheme);
                messageInput.focus();
                updateEmptyState();
            }
            if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } 
            else { init(); }
        })();
    </script>
</body>
</html>
